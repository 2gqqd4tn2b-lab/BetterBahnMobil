<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Split-Suche</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1ee;--surface:#ffffff;--ink:#23342f;--muted:#5b6e68;--line:#cdd8d3;--signal:#f2c230;--signal-ink:#23342f;--ok:#1f7a4d;--bad:#b3261e;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c1a;--surface:#1f2a27;--ink:#e4ece8;--muted:#a3b5ae;--line:#33433e;--signal:#f2c230;--signal-ink:#1d2622;--ok:#6fd3a0;--bad:#f2a49d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141c1a;--surface:#1f2a27;--ink:#e4ece8;--muted:#a3b5ae;--line:#33433e;--signal:#f2c230;--signal-ink:#1d2622;--ok:#6fd3a0;--bad:#f2a49d;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:32px 20px 56px}
h1{font-size:30px;line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px}
.stub{position:relative;display:flex;align-items:stretch;background:var(--signal);color:var(--signal-ink);border-radius:14px;overflow:hidden;
-webkit-mask:radial-gradient(circle 11px at 0 50%,transparent 10px,#000 11px) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,transparent 10px,#000 11px) right/51% 100% no-repeat;
mask:radial-gradient(circle 11px at 0 50%,transparent 10px,#000 11px) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,transparent 10px,#000 11px) right/51% 100% no-repeat}
.stub button,.stub a{flex:1;border:0;background:none;color:inherit;font:inherit;font-weight:700;font-size:19px;padding:22px 26px;text-align:left;cursor:pointer;text-decoration:none}
.stub .side{border-left:2px dashed rgba(35,52,47,.45);padding:0 26px;display:flex;align-items:center;font-size:28px}
.stub button:focus-visible,.stub a:focus-visible{outline:3px solid var(--ink);outline-offset:-6px;border-radius:10px}
.copied{color:var(--ok);font-weight:700;min-height:1.5em;margin:10px 2px 0}
h2{font-size:22px;margin:44px 0 6px}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
ol{padding:0;margin:0;list-style:none;counter-reset:s}
ol li{counter-increment:s;position:relative;padding:0 0 16px 46px}
ol li::before{content:counter(s);position:absolute;left:0;top:-1px;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.hint{display:block;color:var(--muted);font-size:15px;margin-top:4px}
kbd{font:inherit;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:20px;font-size:15px}
.box p{margin:0 0 8px}.box p:last-child{margin:0}
details{margin-top:28px}
summary{cursor:pointer;font-weight:700}
textarea{width:100%;height:120px;margin-top:10px;font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;margin:0 0 24px}
.tabs button{flex:1;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:10px 6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
[hidden]{display:none!important}

.gate{max-width:420px;margin:0 auto;padding:48px 20px 56px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ticket .top{background:var(--signal);color:var(--signal-ink);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:19px}
.ticket .perf{height:0;border-top:2px dashed var(--line);margin:0 14px}
.ticket .body{padding:20px 22px 22px}
label{display:block;font-weight:700;font-size:15px;margin:14px 0 6px}
input[type=password],input[type=text],textarea.f{display:block;width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea.f{height:90px;margin:0}
.ckl{display:flex;gap:10px;align-items:center;font-weight:400;margin-top:14px}
.ckl input{width:20px;height:20px;margin:0}
.btn{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;font-size:17px;padding:14px;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.err{color:var(--bad);font-weight:700;min-height:1.5em;margin:10px 0 0}
.ok{color:var(--ok);font-weight:700;margin:10px 0 0}
.hp{position:absolute;left:-9999px}
.bar{display:flex;justify-content:flex-end;max-width:560px;margin:0 auto;padding:14px 20px 0}
.bar button{border:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:14px;border-radius:8px;padding:6px 12px;cursor:pointer}

</style>
</head>
<body>
<div class="gate" id="gate">
<div class="ticket">
<div class="top"><span>Split-Suche</span><span aria-hidden="true">🎫</span></div>
<div class="perf"></div>
<div class="body">
<form id="login">
<label for="pw">Dein Passwort</label>
<input type="password" id="pw" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label class="ckl"><input type="checkbox" id="keep" checked> Auf diesem Gerät angemeldet bleiben</label>
<button class="btn" type="submit" id="go">Öffnen</button>
<p class="err" id="lerr" aria-live="polite"></p>
</form>
<button class="btn alt" type="button" id="askbtn">Zugriff anfragen</button>
<form id="ask" hidden>
<p class="sub" style="margin:16px 0 0">Ich schalte dich frei und schicke dir dein persönliches Passwort.</p>
<label for="an">Dein Name</label>
<input type="text" id="an" maxlength="80" required>
<label for="ac">Wie erreiche ich dich?</label>
<input type="text" id="ac" maxlength="120" placeholder="Telefon oder E-Mail" required>
<label for="am">Nachricht (optional)</label>
<textarea class="f" id="am" maxlength="500"></textarea>
<input class="hp" type="text" id="aw" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" type="submit" id="asend">Anfrage senden</button>
<p class="err" id="aerr" aria-live="polite"></p>
</form>
<p class="ok" id="aok" hidden>Anfrage gesendet. Du bekommst dein Passwort persönlich.</p>
</div>
</div>
</div>
<div id="app" hidden>
<div class="bar"><button type="button" id="logout">Abmelden</button></div>
<main id="guide"></main>
</div>

const ITER = 150000;
const enc = new TextEncoder();
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const bu = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function hintOf(pw) { const d = await crypto.subtle.digest('SHA-256', enc.encode('splitsuche|' + pw)); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 16); }
async function kekOf(pw, salt) { const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
async function loadUsers() { const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) throw new Error('users.json nicht gefunden'); return r.json(); }
async function unlockKey(users, pw, onlyName) {
  const h = await hintOf(pw.trim());
  const e = users.find(u => u.h === h && (!onlyName || u.n === onlyName));
  if (!e) return null;
  try { const k = await kekOf(pw.trim(), ub(e.s)); return { raw: new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(e.i) }, k, ub(e.w))), entry: e }; } catch (err) { return null; }
}
function wireGuide(root, BM) {
  root.querySelectorAll('[data-raw]').forEach(t => { t.value = BM; });
  root.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const msg = root.querySelector('[data-msg]');
      try { await navigator.clipboard.writeText(BM); msg.textContent = 'Kopiert. Weiter mit dem nächsten Schritt.'; }
      catch (e) { const raw = root.querySelector('[data-raw]'); raw.closest('details').open = true; raw.focus(); raw.select(); msg.textContent = 'Automatisches Kopieren ging nicht. Kopiere den Code unten von Hand.'; }
    });
  });
  root.querySelectorAll('[data-drag]').forEach(a => {
    a.href = BM;
    a.addEventListener('click', ev => { ev.preventDefault(); const m = root.querySelector('[data-dragmsg]'); if (m) m.textContent = 'Nicht klicken, sondern mit der Maus in die Favoritenleiste ziehen.'; });
  });
}
async function openWith(pw) {
  const users = await loadUsers();
  const u = await unlockKey(users, pw);
  if (!u) return false;
  const key = await crypto.subtle.importKey('raw', u.raw, 'AES-GCM', false, ['decrypt']);
  const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(DATA.i) }, key, ub(DATA.c))));
  const g = document.getElementById('guide');
  g.innerHTML = p.html;
  wireGuide(g, p.bm);
  let seen = null; try { seen = localStorage.getItem('splitsuche-ver'); } catch (e) {}
  if (seen && seen !== p.ver) { const n = document.createElement('div'); n.className = 'box'; n.style.cssText = 'margin:0 0 24px;border:2px solid var(--signal)'; n.innerHTML = '<p><b>Neue Version ' + p.ver + '.</b> Tippe auf <kbd>Code kopieren</kbd> und setz den Code wie in Teil B in dein Lesezeichen ein.</p>'; g.insertBefore(n, g.querySelector('.tabs')); }
  g.querySelectorAll('[data-copy],[data-raw]').forEach(x => x.addEventListener(x.matches('textarea') ? 'focus' : 'click', () => { try { localStorage.setItem('splitsuche-ver', p.ver); } catch (e) {} }));
  const tabs = [...g.querySelectorAll('[data-tab]')];
  const show = t => { tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t))); g.querySelectorAll('[data-pane]').forEach(s => { s.hidden = s.dataset.pane !== t; }); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  const ua = navigator.userAgent;
  show(/Android/i.test(ua) ? 'android' : /iPhone|iPad|iPod/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua)) ? 'ios' : /Macintosh|Windows|Linux/.test(ua) ? 'mac' : 'ios');
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  return true;
}
const lerr = document.getElementById('lerr');
document.getElementById('login').addEventListener('submit', async ev => {
  ev.preventDefault();
  const pw = document.getElementById('pw').value;
  const go = document.getElementById('go');
  go.disabled = true; go.textContent = 'Prüfe …'; lerr.textContent = '';
  try {
    if (await openWith(pw)) { try { if (document.getElementById('keep').checked) localStorage.setItem('splitsuche-pw', pw); } catch (e) {} }
    else lerr.textContent = 'Dieses Passwort passt nicht. Prüf Groß- und Kleinschreibung und die Bindestriche.';
  } catch (e) { lerr.textContent = 'Die Seite konnte nicht geladen werden. Prüf deine Internetverbindung.'; }
  go.disabled = false; go.textContent = 'Öffnen';
});
document.getElementById('logout').addEventListener('click', () => { try { localStorage.removeItem('splitsuche-pw'); } catch (e) {} location.reload(); });
document.getElementById('askbtn').addEventListener('click', ev => { ev.currentTarget.hidden = true; document.getElementById('ask').hidden = false; document.getElementById('an').focus(); });
document.getElementById('ask').addEventListener('submit', async ev => {
  ev.preventDefault();
  const aerr = document.getElementById('aerr');
  if (document.getElementById('aw').value) return;
  const name = document.getElementById('an').value.trim(), con = document.getElementById('ac').value.trim(), msg = document.getElementById('am').value.trim();
  const b = document.getElementById('asend'); b.disabled = true; b.textContent = 'Sende …'; aerr.textContent = '';
  try {
    const r = await fetch('https://ntfy.sh/', { method: 'POST', body: JSON.stringify({ topic: TOPIC, title: 'Zugriffsanfrage Split-Suche', message: 'Name: ' + name + '\nKontakt: ' + con + (msg ? '\nNachricht: ' + msg : ''), tags: ['ticket'] }) });
    if (!r.ok) throw new Error(r.status);
    document.getElementById('ask').hidden = true; document.getElementById('aok').hidden = false;
  } catch (e) { aerr.textContent = 'Die Anfrage ging nicht raus. Versuch es später noch einmal.'; b.disabled = false; b.textContent = 'Anfrage senden'; }
});
(async () => { let pw = null; try { pw = localStorage.getItem('splitsuche-pw'); } catch (e) {} if (pw) { try { if (!(await openWith(pw))) localStorage.removeItem('splitsuche-pw'); } catch (e) {} } })();
</script>
</body>
